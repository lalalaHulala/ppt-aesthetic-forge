name: Guard

# 守住这个项目的三条底线：单文件、零依赖、不联网。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 禁止外部资源引用
        run: |
          if grep -nE '<script[^>]+src=|<link[^>]*href=|@import|<img[^>]+src=' ppt-aesthetic-forge.html; then
            echo "::error file=ppt-aesthetic-forge.html::检测到外部资源引用。本项目必须保持单文件、零依赖、不联网。"
            exit 1
          fi
          echo "外部资源引用：0"

      - name: 禁止网络请求代码
        run: |
          if grep -nE 'fetch\(|XMLHttpRequest|sendBeacon|new WebSocket|EventSource' ppt-aesthetic-forge.html; then
            echo "::error file=ppt-aesthetic-forge.html::检测到网络请求代码。"
            exit 1
          fi
          echo "网络请求代码：0"

      - name: 校验内联 JS 语法
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("ppt-aesthetic-forge.html", "utf8");
            const a = s.indexOf("<script>");
            const b = s.lastIndexOf("</script>");
            if (a < 0 || b < 0) { console.error("未找到内联脚本"); process.exit(1); }
            fs.writeFileSync("/tmp/app.js", s.slice(a + 8, b));
            console.log("提取脚本 " + (b - a - 8) + " 字节");
          '
          node --check /tmp/app.js
          echo "JS 语法：通过"

      - name: 检查文件体积
        run: |
          size=$(wc -c < ppt-aesthetic-forge.html)
          echo "单文件体积：$size 字节"
          if [ "$size" -gt 400000 ]; then
            echo "::error file=ppt-aesthetic-forge.html::超过 400KB，确认是否误引入大段资源。"
            exit 1
          fi

      - name: 检查仓库根目录只有一个 HTML
        run: |
          count=$(ls *.html 2>/dev/null | wc -l)
          echo "根目录 HTML 文件数：$count"
          if [ "$count" -ne 1 ]; then
            echo "::error::根目录应当只有一个 HTML，实际 $count 个。"
            exit 1
          fi

  integration:
    # 守住「大脑抽取层」与 HTML 不脱节：CLI / MCP 读的都是 HTML 里的同一份数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自检（10 套方案 · DNA 往返 · 覆盖 · 对比度）
        run: node tools/selftest.mjs

      - name: AI 入口文件与 HTML 同步
        # llms.txt / ai/* 全部由 HTML 生成。改了 HTML 忘了跑 gen:ai，这里会拦住
        run: node tools/gen-ai.mjs --check

      - name: AI 入口文件体积与外部引用
        run: |
          total=0
          for f in llms.txt ai/spec.md ai/prompt.txt ai/starter.html ai/presets.json; do
            size=$(wc -c < "$f")
            echo "$f：$size 字节"
            total=$((total + size))
          done
          echo "五个入口合计：$total 字节"
          if [ "$total" -gt 120000 ]; then
            echo "::error::AI 入口合计超过 120KB。给模型读的东西必须轻，别往里塞图片或大段内联资源。"
            exit 1
          fi
          if grep -nE '<script[^>]+src=|<img[^>]+src=' ai/starter.html; then
            echo "::error file=ai/starter.html::骨架必须零外部引用。"
            exit 1
          fi
          echo "外部引用：0"

      - name: CLI 冒烟
        run: |
          node bin/paf.mjs list > /dev/null
          node bin/paf.mjs dims > /dev/null
          node bin/paf.mjs spec --design keynote --json > /tmp/spec.json
          node -e '
            const s = require("/tmp/spec.json");
            if (s.schema !== "ppt-aesthetic-forge/spec@1") process.exit(1);
            if (!s.dna.startsWith("AF:")) process.exit(1);
            console.log("CLI 输出合法，DNA = " + s.dna);
          '
          node bin/paf.mjs dna AF:consulting:inkblue:sans:datagrid:clean:dense:jeii --dna

      - name: MCP 握手冒烟
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | node bin/paf-mcp.mjs 2>/dev/null > /tmp/mcp.out
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("/tmp/mcp.out", "utf8").trim().split("\n").map(JSON.parse);
            const init = lines.find(m => m.id === 1);
            const list = lines.find(m => m.id === 2);
            if (!init?.result?.serverInfo?.name) { console.error("initialize 失败"); process.exit(1); }
            if (list.result.tools.length !== 4) { console.error("工具数应为 4，实际 " + list.result.tools.length); process.exit(1); }
            console.log("MCP 就绪，工具：" + list.result.tools.map(t => t.name).join(", "));
          '

      - name: 禁止 npm 运行时依赖
        run: |
          node -e '
            const p = require("./package.json");
            if (p.dependencies && Object.keys(p.dependencies).length) {
              console.error("::error::不允许引入运行时依赖"); process.exit(1);
            }
            console.log("运行时依赖：0");
          '
